<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Rooms</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #111827;
            color: #f9fafb;
            min-height: 100vh;
            padding: 60px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 36px;
        }

        .header p {
            color: #818cf8;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: clamp(30px, 5vw, 42px);
            letter-spacing: -1.5px;
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #9ca3af;
            font-size: 15px;
            line-height: 1.6;
        }

        .room-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .room-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 22px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            text-decoration: none;
            color: #f9fafb;
            transition: border-color 0.2s, background 0.2s,
                        transform 0.2s;
        }

        .room-card:hover {
            background: #273449;
            border-color: #6366f1;
            transform: translateY(-2px);
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .room-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            background: #312e81;
            border-radius: 10px;
            color: #c7d2fe;
            font-size: 21px;
        }

        .room-name {
            font-size: 16px;
            font-weight: 600;
        }

        .room-description {
            margin-top: 5px;
            color: #9ca3af;
            font-size: 13px;
        }

        .arrow {
            color: #9ca3af;
            font-size: 22px;
        }

        .empty-state {
            padding: 40px 24px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            text-align: center;
            color: #9ca3af;
            line-height: 1.7;
        }

        @media (max-width: 500px) {
            body {
                padding: 40px 16px;
            }

            .room-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="header">
            <p>Real-time messaging</p>
            <h1>Chat Rooms</h1>
            <div class="subtitle">
                Choose a room and join the conversation.
            </div>
        </header>

        <div class="room-list">
            {% for chatroom in chatrooms %}
                <a
                    class="room-card"
                    href="{% url 'rooms:chats' chatroom.slug %}"
                >
                    <div class="room-info">
                        <div class="room-icon">#</div>

                        <div>
                            <div class="room-name">
                                {{ chatroom.name }}
                            </div>
                            <div class="room-description">
                                Join this conversation
                            </div>
                        </div>
                    </div>

                    <span class="arrow">→</span>
                </a>
            {% empty %}
                <div class="empty-state">
                    <p>No chat rooms available yet.</p>
                </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
