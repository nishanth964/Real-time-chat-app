<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chatrooms.name }} | Chat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #111827;
            color: #f9fafb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 750px;
            height: 85vh;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .chat-header {
            padding: 22px 26px;
            background: #1f2937;
            border-bottom: 1px solid #374151;
        }

        .chat-header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .chat-header p {
            margin-top: 6px;
            font-size: 13px;
            color: #9ca3af;
        }

        .status {
            color: #34d399;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            width: fit-content;
            padding: 12px 16px;
            background: #374151;
            color: #f9fafb;
            border-radius: 12px 12px 12px 3px;
            overflow-wrap: anywhere;
            line-height: 1.5;
            font-size: 14px;
        }

        .empty-state {
            margin: auto;
            color: #9ca3af;
            text-align: center;
            font-size: 14px;
        }

        .chat-form {
            display: flex;
            gap: 12px;
            padding: 18px 22px;
            border-top: 1px solid #374151;
            background: #1f2937;
        }

        #message-input {
            flex: 1;
            min-width: 0;
            padding: 13px 16px;
            background: #111827;
            color: #f9fafb;
            border: 1px solid #4b5563;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        #message-input:focus {
            border-color: #818cf8;
        }

        #message-input::placeholder {
            color: #6b7280;
        }

        #send-button {
            padding: 0 22px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        #send-button:hover {
            background: #4f46e5;
        }

        #send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 10px;
        }

        @media (max-width: 500px) {
            body {
                padding: 0;
            }

            .chat-container {
                height: 100dvh;
                border-radius: 0;
                border: none;
            }

            .chat-header {
                padding: 18px;
            }

            #messages {
                padding: 16px;
            }

            .chat-form {
                padding: 14px;
            }

            #send-button {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>
    <main class="chat-container">
        <header class="chat-header">
            <h1>{{ chatrooms.name }}</h1>
            <p><span class="status">●</span> Real-time chat room</p>
        </header>

        <div id="messages">
            {% for message in messages %}
                <p class="message">{{ message.content }}</p>
            {% empty %}
                <p class="empty-state" id="empty-state">
                    No messages yet. Start the conversation.
                </p>
            {% endfor %}
        </div>

        <form class="chat-form" id="chat-form">
            <input
                id="message-input"
                type="text"
                placeholder="Type a message..."
                autocomplete="off"
                maxlength="2000"
                required
            >
            <button id="send-button" type="submit">Send</button>
        </form>
    </main>

    <script>
        const roomSlug = "{{ chatrooms.slug|escapejs }}";
        const protocol = window.location.protocol === "https:" ? "wss" : "ws";

        const socket = new WebSocket(
            `${protocol}://${window.location.host}/ws/chat/${roomSlug}/`
        );

        const messages = document.getElementById("messages");
        const input = document.getElementById("message-input");
        const form = document.getElementById("chat-form");
        const sendButton = document.getElementById("send-button");

        function scrollToBottom() {
            messages.scrollTop = messages.scrollHeight;
        }

        function appendMessage(content) {
            const emptyState = document.getElementById("empty-state");

            if (emptyState) {
                emptyState.remove();
            }

            const messageElement = document.createElement("p");
            messageElement.className = "message";
            messageElement.textContent = content;

            messages.appendChild(messageElement);
            scrollToBottom();
        }

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const message = input.value.trim();

            if (message && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ message }));
                input.value = "";
                input.focus();
            }
        });

        socket.onopen = function () {
            sendButton.disabled = false;
        };

        socket.onmessage = function (event) {
            const data = JSON.parse(event.data);
            appendMessage(data.message);
        };

        socket.onclose = function () {
            sendButton.disabled = true;
        };

        socket.onerror = function () {
            console.error("WebSocket connection error");
        };

        sendButton.disabled = true;
        scrollToBottom();
    </script>
</body>
</html>
